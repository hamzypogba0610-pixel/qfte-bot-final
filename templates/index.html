<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFTE V23.0 – Bot d'analyse</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 15px; background: #0f0f0f; color: #eee; }
        h1 { color: #4ade80; text-align: center; }
        h2 { color: #facc15; margin-top: 25px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #eee; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 12px; background: #4ade80; color: #000; font-weight: bold; border: none; border-radius: 6px; font-size: 16px; }
        .lien-dashboard { text-align: center; margin-top: 10px; }
        .lien-dashboard a { color: #60a5fa; text-decoration: none; }
        .aide { color: #9ca3af; font-size: 12px; margin-top: 2px; font-weight: normal; }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
    <h1>🦁 QFTE V23.0</h1>
    <p class="lien-dashboard"><a href="/dashboard">📊 Voir le dashboard</a></p>

    <form action="/analyser" method="post">
        <h2>🏟️ Match</h2>
        <label>Sport</label>
        <select name="sport">
            <option value="football">Football</option>
            <option value="basket">Basket</option>
            <option value="tennis">Tennis</option>
        </select>

        <label>Compétition</label>
        <input type="text" name="competition" placeholder="Ex: Ligue 1" required>

        <label>Équipe / Joueur 1 (à domicile)</label>
        <input type="text" name="equipe1" required>

        <label>Équipe / Joueur 2 (à l'extérieur)</label>
        <input type="text" name="equipe2" required>

        <h2>📊 Cotes 1X2 (les 2 équipes)</h2>
        <label>Cote Équipe 1 — Ouverture / Fermeture</label>
        <div class="row">
            <div><input type="number" step="0.01" name="cote_ouv_1" placeholder="Ouv." required></div>
            <div><input type="number" step="0.01" name="cote_ferm_1" placeholder="Ferm." required></div>
        </div>
        <label>Cote Équipe 2 — Ouverture / Fermeture</label>
        <div class="row">
            <div><input type="number" step="0.01" name="cote_ouv_2" placeholder="Ouv." required></div>
            <div><input type="number" step="0.01" name="cote_ferm_2" placeholder="Ferm." required></div>
        </div>

        <h2>📈 Équipe 1 — à domicile</h2>

        <label>5 derniers résultats à domicile (V/N/D)</label>
        <input type="text" name="forme_dom_5" placeholder="Ex: V V N D V" required>

        <label>5 derniers scores à domicile</label>
        <input type="text" name="scores_dom_5" placeholder="Ex: 2-1,1-0,3-2,0-0,1-1" required>
        <div class="aide">Format : buts_pour-buts_contre, séparés par des virgules</div>

        <label>5 derniers résultats globaux (V/N/D)</label>
        <input type="text" name="forme_dom_glob_5" placeholder="Ex: V D V V N" required>

        <label>5 derniers scores globaux</label>
        <input type="text" name="scores_dom_glob_5" placeholder="Ex: 2-1,1-2,3-0,1-1,0-1" required>

        <h2>📉 Équipe 2 — à l'extérieur</h2>

        <label>5 derniers résultats à l'extérieur (V/N/D)</label>
        <input type="text" name="forme_ext_5" placeholder="Ex: D V N V D" required>

        <label>5 derniers scores à l'extérieur</label>
        <input type="text" name="scores_ext_5" placeholder="Ex: 1-2,0-1,2-3,1-1,0-0" required>

        <label>5 derniers résultats globaux (V/N/D)</label>
        <input type="text" name="forme_ext_glob_5" placeholder="Ex: N D V D N" required>

        <label>5 derniers scores globaux</label>
        <input type="text" name="scores_ext_glob_5" placeholder="Ex: 1-2,0-1,2-1,1-3,1-1" required>

        <h2>⚔️ Confrontations directes (H2H)</h2>
        <label>5 derniers scores H2H (Équipe1-Équipe2)</label>
        <input type="text" name="h2h_5" placeholder="Ex: 2-1,1-1,0-2,3-0,1-0" required>

        <h2>🎯 Cotes des 3 marchés analysés</h2>
        <label id="label_ah">Cote Handicap Asiatique -0.5</label>
        <input type="number" step="0.01" name="cote_ah" id="input_ah" required>

        <label id="label_over25">Cote Over 2.5</label>
        <input type="number" step="0.01" name="cote_over25" id="input_over25" required>

        <label id="label_btts">Cote BTTS Oui</label>
        <input type="number" step="0.01" name="cote_btts" id="input_btts" required>

        <h2>💰 Marché</h2>
        <label>Volume de paris (€)</label>
        <input type="number" name="volume" value="50000" required>

        <button type="submit">Analyser</button>
    </form>

    <script>
        const selectSport = document.querySelector('select[name="sport"]');
        function majLabels() {
            const sport = selectSport.value;
            const lAh = document.getElementById("label_ah");
            const lOv = document.getElementById("label_over25");
            const lBt = document.getElementById("label_btts");
            if (sport === "basket") {
                lAh.textContent = "Cote Spread -4.5 (Domicile)";
                lOv.textContent = "Cote Total Points Over 180.5";
                lBt.textContent = "Cote Money Line Domicile";
            } else if (sport === "tennis") {
                lAh.textContent = "Cote Vainqueur Joueur 1";
                lOv.textContent = "Cote Over 22.5 jeux";
                lBt.textContent = "Cote Joueur 1 gagne 2-0";
            } else {
                lAh.textContent = "Cote Handicap Asiatique -0.5";
                lOv.textContent = "Cote Over 2.5";
                lBt.textContent = "Cote BTTS Oui";
            }
        }
        selectSport.addEventListener("change", majLabels);
        majLabels();
    </script>
</body>
            </html>
